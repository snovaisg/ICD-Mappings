[tool.poetry]
name = "icd-mappings"
version = "0.6.2"
description = "This python tool enables a variety of mappings between ICD diagnostic codes (International Classification of Diseases) with a single line of code."
authors = ["Simao Novais <snovaisg.97@gmail.com>"]
license = "MIT License"
readme = "README.md"
repository = "https://github.com/snovaisg/ICDMappings"
packages = [{include = "icdmappings"}]
include = ["data_sources/*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = "^3.8"
importlib-resources = ">=5.12.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
openpyxl = "^3.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
